[package]
name = "cfpb-complaints-mcp"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
description = "CFPB Consumer Complaint Database MCP server (WebAssembly component, wasi:http@0.3.0)"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
# Official Model Context Protocol SDK. The streamable-http-server transport is
# pure `http`/`http-body` types (no hyper/axum), so it compiles to wasm32-wasip2.
rmcp = { version = "3.1.1", default-features = false, features = [
    "server",
    "macros",
    "schemars",
    "transport-streamable-http-server",
] }

# WASI 0.3 bindings: exports the `wasi:http@0.3.0` service world and bridges
# to hyperium `http` types via `http_compat`.
wasip3 = { version = "0.7.0", features = ["http-compat"] }

# The bridge parks tasks on Rust-only events (the request-lock mutex, the
# outbound-reply oneshot). Under concurrent same-instance invocation the
# component-model executor must be able to wake one task from another's action,
# which requires wit-bindgen's `inter-task-wakeup` feature. wasip3 only forwards
# `async-spawn`, so enable it here directly (Cargo unifies features across the
# graph, turning it on for wasip3's generated code too). Version pinned to match
# wasip3's wit-bindgen. WITHOUT this, any outbound tool traps under concurrency.
wit-bindgen = { version = "0.57.1", default-features = false, features = [
    "async",
    "async-spawn",
    "inter-task-wakeup",
] }

http = "1"
http-body = "1"
http-body-util = "0.1"
bytes = "1"

# rmcp drives its session/dispatch machinery with tokio primitives; on
# wasm32-wasip2 we run a single-threaded runtime. Outbound I/O goes through
# the wasi:http bindings (see src/bridge.rs), not tokio::net.
tokio = { version = "1.50", features = ["rt", "macros", "sync", "time", "io-util"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
thiserror = "2"

# Percent-encoding for the query strings sent to the CFPB API. Company names
# and search terms routinely contain `&`, spaces, and the U+2022 bullet the
# API uses to join a product with its sub-product.
urlencoding = "2"

# Observability: structured JSON logs on stderr. The wasmCloud / Cosmonic host
# captures stderr and exports it as OTLP log records when OTEL is enabled.
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = [
    "fmt",
    "env-filter",
    "json",
    "registry",
] }

[profile.release]
opt-level = "s"
lto = true
strip = true
