# Cosmonic Desktop / wasmCloud v2 Workload manifest for this MCP server.
#
# Replace `image` with the digest-pinned reference returned by promote
# (`cosmonic_promote` or the Cosmonic Desktop UI), then apply with
# `cosmonic_apply_workload` or POST /v1/workloads.
#
# The wasi:http hostInterface routes ingress traffic to this workload by HTTP
# Host header. Note `interfaces: ["handler"]` — the WASI p3 (wasi:http@0.3.0)
# handler export, not the p2 `incoming-handler`.
apiVersion: runtime.wasmcloud.dev/v1alpha1
kind: Workload
metadata:
  name: after-effects-mcp
  namespace: default
  # MCP metadata convention used by Cosmonic Desktop to catalog MCP servers.
  # Update name/version/domain when you fork this template.
  labels:
    app.kubernetes.io/name: "after-effects-mcp"
    app.kubernetes.io/version: "0.1.0"
    "mcp.ai/auth-type": none
    mcp.ai/domain: "adobe-after-effects"
    "mcp.ai/function-type": tools
    "mcp.ai/spec-version": "2026-07-28"
    # The MCP transport is stateless (no sessions), but the server is not: the
    # bridge command queue lives in the host keyvalue store below.
    mcp.ai/statefulness: stateless
    mcp.ai/transport: "streamable-http"
  annotations:
    desktop.cosmonic.com/source: mcp
spec:
  hostInterfaces:
    - namespace: wasi
      package: http
      interfaces: ["handler"]
      config:
        host: after-effects-mcp.localhost
    # Holds the one-slot command queue that connects an MCP tool call to the
    # After Effects panel poll that services it. Those are two separate HTTP
    # requests and may land on different instances, so the queue cannot live
    # in component memory. Without this interface the component will not
    # instantiate.
    - namespace: wasi
      package: keyvalue
      interfaces: ["store"]
  components:
    - name: mcp
      image: oci-registry.localhost:8200/after-effects-mcp:0.1.0
      # Several warm instances so a tool call waiting on a result never
      # starves the panel's poll requests.
      poolSize: 4
      maxInvocations: 0
      localResources:
        environment:
          config:
            RUST_LOG: info
            # DNS-rebinding guard: hosts the transport accepts in the Host
            # header (`host` matches any port; `host:port` is exact; `*`
            # disables the guard). Unset, only localhost/127.0.0.1/::1 are
            # accepted — Cosmonic routes to this workload by Host header, so
            # this must match the hostInterface `host` above.
            MCP_ALLOWED_HOSTS: "after-effects-mcp.localhost"
            # Namespace for this server's keyvalue keys. Desktop's default
            # bucket is host-wide, so two After Effects bridges sharing a
            # prefix would steal each other's queued commands. Change this if
            # you run a second one.
            MCP_BRIDGE_KEY_PREFIX: "after-effects-mcp"
        # Outbound allow-list — empty means deny-all (fail-closed). The bridge
        # is *inbound*: After Effects dials this workload, never the reverse.
        allowedHosts: []
