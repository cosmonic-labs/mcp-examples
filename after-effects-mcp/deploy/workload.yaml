# Cosmonic Desktop deployment manifest for the published after-effects-mcp
# image. Local iteration uses ../workload.yaml (Desktop's built-in registry);
# this manifest deploys the released image.
# Docs: https://cosmonic.com/docs/desktop
apiVersion: runtime.wasmcloud.dev/v1alpha1
kind: Workload
metadata:
  name: "after-effects-mcp"
  namespace: default
  labels:
    app.kubernetes.io/name: "after-effects-mcp"
    app.kubernetes.io/version: "0.1.0"
    "mcp.ai/auth-type": none
    mcp.ai/domain: "adobe-after-effects"
    "mcp.ai/function-type": tools
    "mcp.ai/spec-version": "2026-07-28"
    mcp.ai/statefulness: stateless
    mcp.ai/transport: "streamable-http"
  annotations:
    desktop.cosmonic.com/source: mcp
spec:
  hostInterfaces:
    - namespace: wasi
      package: http
      # wasi:http@0.3.0 (WASI p3): the single `handler` interface is this
      # component's ingress export — not the p2 `incoming-handler`.
      interfaces:
        - "handler"
      config:
        host: "after-effects-mcp.localhost.cosmonic.sh"
    # Bridge command queue — see ../workload.yaml for why it cannot live in
    # component memory. The component will not instantiate without it.
    - namespace: wasi
      package: keyvalue
      interfaces:
        - "store"
  components:
    - name: "after-effects-mcp"
      # Desktop pins this tag to a digest at apply time. To deploy a locally
      # promoted build instead, use the digest-pinned
      # oci-registry.localhost:8200 reference that promote returns.
      image: "ghcr.io/cosmonic-labs/mcp-examples/after-effects-mcp:0.1.0"
      # Several warm instances so a tool call waiting on a result never
      # starves the After Effects panel's poll requests.
      poolSize: 4
      maxInvocations: 0
      localResources:
        environment:
          config:
            RUST_LOG: info
            # DNS-rebinding guard: must list the ingress host(s) above.
            MCP_ALLOWED_HOSTS: "after-effects-mcp.localhost.cosmonic.sh,after-effects-mcp.localhost"
            # Keyvalue key namespace — the host's default bucket is shared, so
            # a second After Effects bridge needs a different prefix.
            MCP_BRIDGE_KEY_PREFIX: "after-effects-mcp"
        # No outbound hosts (deny-all). After Effects dials in; this workload
        # never dials out.
        allowedHosts: []
