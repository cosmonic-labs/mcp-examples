# Cosmonic Desktop deployment manifest for the published sec-edgar-mcp image.
# Local iteration uses ../workload.yaml (Desktop's built-in registry); this
# manifest deploys the released image. Docs: https://cosmonic.com/docs/desktop
apiVersion: runtime.wasmcloud.dev/v1alpha1
kind: Workload
metadata:
  name: "sec-edgar-mcp"
  namespace: default
  labels:
    app.kubernetes.io/name: "sec-edgar-mcp"
    app.kubernetes.io/version: "0.1.0"
    "mcp.ai/auth-type": none
    mcp.ai/domain: "sec-edgar"
    "mcp.ai/function-type": tools
    "mcp.ai/spec-version": "2026-07-28"
    mcp.ai/statefulness: stateless
    mcp.ai/transport: "streamable-http"
  annotations:
    desktop.cosmonic.com/source: mcp
spec:
  hostInterfaces:
    - namespace: wasi
      package: http
      # wasi:http@0.3.0 (WASI p3): the single `handler` interface is this
      # component's ingress export — not the p2 `incoming-handler`.
      interfaces:
        - "handler"
      config:
        host: "sec-edgar-mcp.localhost.cosmonic.sh"
  components:
    - name: "sec-edgar-mcp"
      # Desktop pins this tag to a digest at apply time. To deploy a locally
      # promoted build instead, use the digest-pinned
      # oci-registry.localhost:8200 reference that promote returns.
      image: "ghcr.io/cosmonic-labs/mcp-examples/sec-edgar-mcp:0.1.0"
      poolSize: 1
      maxInvocations: 0
      localResources:
        environment:
          config:
            RUST_LOG: info
            # DNS-rebinding guard: must list the ingress host(s) above.
            MCP_ALLOWED_HOSTS: "sec-edgar-mcp.localhost.cosmonic.sh,sec-edgar-mcp.localhost"
            # SEC requires a User-Agent naming a real contact ("Name email");
            # requests without one are refused with HTTP 403.
            SEC_USER_AGENT: "Cosmonic Labs sec-edgar-mcp admin@cosmonic.com"
            # Some EDGAR documents (submissions for very active filers)
            # exceed the default 4 MiB outbound response cap.
            MCP_OUTBOUND_MAX_BYTES: "33554432"
        # Outbound allow-list — the only two hosts EDGAR uses.
        allowedHosts:
          - www.sec.gov
          - data.sec.gov
