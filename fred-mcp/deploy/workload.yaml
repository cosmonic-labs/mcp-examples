# Cosmonic Desktop deployment manifest for the published fred-mcp image.
# Local iteration uses ../workload.yaml (Desktop's built-in registry); this
# manifest deploys the released image. Docs: https://cosmonic.com/docs/desktop
#
# Requires a FRED API key registered as a Cosmonic secret before applying.
# Get a free key at https://fred.stlouisfed.org/docs/api/api_key.html, then
# register a keychain-backed secret reference with the `cosmonic_set_secret`
# MCP tool (the value goes into your OS keychain, never into this manifest):
#   name:  fred-api-key                      # matches secretFrom below
#   uri:   keychain://cosmonic/fred-api-key
#   env:   FRED_API_KEY                      # variable injected into the component
#   value: <your-key>
apiVersion: runtime.wasmcloud.dev/v1alpha1
kind: Workload
metadata:
  name: "fred-mcp"
  namespace: default
  labels:
    app.kubernetes.io/name: "fred-mcp"
    app.kubernetes.io/version: "0.1.0"
    "mcp.ai/auth-type": none
    mcp.ai/domain: "federal-reserve-economic-data"
    "mcp.ai/function-type": tools
    "mcp.ai/spec-version": "2026-07-28"
    mcp.ai/statefulness: stateless
    mcp.ai/transport: "streamable-http"
  annotations:
    desktop.cosmonic.com/source: mcp
    # Credential metadata for Cosmonic Desktop (issue #480, Layer 2). A
    # workload whose `secretFrom` ref is not registered is accepted and
    # parked rather than crash-looped; this annotation is what the
    # missing-credential prompt shows — which key, which env var it lands
    # in, what it is, and where to get one. Names and metadata only: a
    # credential VALUE never appears in a manifest.
    desktop.cosmonic.com/credentials: '[{"ref":"fred-api-key","env":"FRED_API_KEY","kind":"api-key","description":"FRED API key, sent as the api_key query parameter on every request to the St. Louis Fed API; free, no scopes, one key per account","obtainUrl":"https://fred.stlouisfed.org/docs/api/api_key.html"}]'
spec:
  hostInterfaces:
    - namespace: wasi
      package: http
      # wasi:http@0.3.0 (WASI p3): the single `handler` interface is this
      # component's ingress export — not the p2 `incoming-handler`.
      interfaces:
        - "handler"
      config:
        host: "fred-mcp.localhost.cosmonic.sh"
  components:
    - name: "fred-mcp"
      # Desktop pins this tag to a digest at apply time. To deploy a locally
      # promoted build instead, use the digest-pinned
      # oci-registry.localhost:8200 reference that promote returns.
      image: "ghcr.io/cosmonic-labs/mcp-examples/fred-mcp:0.1.0"
      poolSize: 1
      maxInvocations: 0
      localResources:
        environment:
          config:
            RUST_LOG: info
            # DNS-rebinding guard: must list the ingress host(s) above.
            MCP_ALLOWED_HOSTS: "fred-mcp.localhost.cosmonic.sh,fred-mcp.localhost"
          # The FRED API key, injected from the registered secret — never
          # inline a real key in a manifest.
          secretFrom:
            - name: fred-api-key
        # Outbound allow-list — the one host FRED uses.
        allowedHosts:
          - api.stlouisfed.org
